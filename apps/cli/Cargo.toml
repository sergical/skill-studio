[package]
name = "skill-studio-cli"
version = "0.2.0"
edition = "2021"
description = "skill-studio: the Skill Studio command line"
license = "MIT"
publish = false

[[bin]]
name = "skill-studio"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
skill-studio-core = { path = "../../crates/skill-studio-core" }
skill-studio-host = { path = "../../crates/skill-studio-host", features = ["telemetry"] }
skill-studio-mcp = { path = "../mcp" }
clap = { version = "4", features = ["derive"] }
serde = "1"
serde_json = { workspace = true }
schemars = { version = "1", features = ["chrono04"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
ulid = { version = "3.0.0", features = ["serde"] }
dirs = "7.0.0"
ctrlc = "3"

[dev-dependencies]
skill-studio-core = { path = "../../crates/skill-studio-core", features = ["testing"] }
tempfile = "3"
similar = "3.2.1"
