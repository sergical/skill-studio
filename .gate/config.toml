ci_workflows = [
  ".github/workflows/rust.yml",
  ".github/workflows/web.yml",
  ".github/workflows/performance.yml",
  ".github/workflows/zizmor.yml",
]
issue_patterns = [
  'https://github\.com/[^/]+/[^/]+/issues/[0-9]+/?',
  'https://[^/]*sentry\.io/.*issues/[0-9]+/?(?:\?.*)?',
]
prepare_linux = [
  [
    "sh",
    "-c",
    "sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev && mkdir -p apps/desktop/dist && cargo build --workspace --all-features --bins",
  ],
]
base = "origin/main"
repository = "sergical/skill-studio"
version_files = ["**/package.json", "package.json", "**/Cargo.toml", "Cargo.toml", "**/tauri*.json"]
dependency_files = ["**/package.json", "package.json", "**/Cargo.toml", "Cargo.toml"]
patch_bots = ["dependabot[bot]", "app/dependabot"]

# What the owner decides for each stop rule, and why a person must decide it.
# gate-risk posts this text on the PR. The agent copies it into its reply.
# The rule ids version, dependencies, check-scripts and policy-change come
# from gate.py, not from [[rules]].
[owner.release]
ask = "Ship a new release to users?"
why = "A release reaches every user who installs or updates Skill Studio. It cannot be taken back from their machines."

[owner.version]
ask = "Change the version number?"
why = "The version decides what users get when they update. A wrong number can skip a release or ship one twice."

[owner.dependencies]
ask = "Accept this outside package change?"
why = "A new package is code we did not write, and it runs with full access to users' skill files. You decide which outside code we trust."

[owner.check-scripts]
ask = "Change the commands that check every PR?"
why = "These scripts decide what passing means. An agent must not change the test that grades its own work."

[owner.gate-policy]
ask = "Change the checks or the merge rules?"
why = "These files decide when an agent PR merges without you. An agent must not loosen the rules that judge its own work."

[owner.policy-change]
ask = "Change the merge rules in .gate/config.toml?"
why = "This file decides which PRs need you. An agent must not change who reviews its own work."

[owner.deploy-secrets]
ask = "Change the live server or its secrets?"
why = "CI cannot test a deploy. A mistake breaks the server for every user or leaks a key."

[owner.policy]
ask = "Change the license or a project policy?"
why = "These are legal and project promises made in your name."

[[rules]]
id = "release"
tier = "stop"
paths = ["**/release.yml", "packages/npm/**", "**/tauri.release.conf.json", "scripts/release/**"]

# pnpm overrides, build permissions, install hooks and patches can swap in or
# change outside code without a package.json change.
[[rules]]
id = "dependencies"
tier = "stop"
paths = ["pnpm-workspace.yaml", ".npmrc", "**/.npmrc", ".pnpmfile.cjs", "**/.pnpmfile.cjs", "patches/**"]

[[rules]]
id = "gate"
tier = "show"
paths = [
  ".github/**",
  "deny.toml",
  "knip.json",
  "doctor.config.ts",
  ".gate/**",
  "scripts/gate/**",
  "*lint*",
  "**/*lint*",
  "*test*config*",
  "**/*test*config*",
  "*playwright*",
  "**/*playwright*",
  ".oxfmtrc.json",
]

[[rules]]
id = "gate-policy"
tier = "stop"
paths = [
  ".gate/*.toml",
  ".gate/.gitignore",
  "scripts/gate/**",
  ".github/workflows/**",
  ".githooks/**",
  "deny.toml",
]

[[rules]]
id = "deploy-secrets"
tier = "stop"
paths = ["**/wrangler.jsonc", "**/wrangler.toml", "**/deploy-server.yml", "**/.env*", ".env*"]

[[rules]]
id = "public-contract"
tier = "show"
paths = [".gate/snapshots/**", "crates/skill-studio-core/schema/*.json"]

[[rules]]
id = "policy"
tier = "stop"
paths = ["LICENSE*", "SECURITY.md", "CODE_OF_CONDUCT.md", "CODEOWNERS", "**/CODEOWNERS"]

[[rules]]
id = "user-files"
tier = "show"
paths = [
  "**/*park*",
  "**/*remove*",
  "**/*install*",
  "**/*fix*",
  "**/*repair*",
  "**/*deploy*",
  "crates/skill-studio-core/src/ops*",
  "crates/skill-studio-host/src/*",
  "apps/desktop/src-tauri/src/skills/lifecycle*",
]

[[rules]]
id = "user-data-writes"
tier = "show"
paths = [
  "crates/skill-studio-core/src/fsops.rs",
  "crates/skill-studio-core/src/ops.rs",
  "crates/skill-studio-core/src/ops_agent_off.rs",
  "crates/skill-studio-core/src/ops_install.rs",
  "crates/skill-studio-core/src/ops_install_cli.rs",
  "crates/skill-studio-core/src/ops_park_dotagents.rs",
  "crates/skill-studio-core/src/ops_split.rs",
  "crates/skill-studio-core/src/ops_remove.rs",
  "crates/skill-studio-core/src/ops_discard.rs",
  "crates/skill-studio-core/src/ops_update.rs",
  "crates/skill-studio-core/src/park_move.rs",
  "crates/skill-studio-core/src/backup_retention.rs",
  "crates/skill-studio-core/src/journal.rs",
  "crates/skill-studio-host/src/fs.rs",
  "apps/desktop/src-tauri/src/skills/skill_fs.rs",
  "apps/desktop/src-tauri/src/skills/skill_md_write.rs",
  "apps/desktop/src-tauri/src/skills/skill_independent_copy.rs",
]

[[rules]]
id = "content"
tier = "show"
paths = ["packages/marketing/**", "README*", "**/README*", "docs/**"]

[[contracts]]
kind = "cli"
env = { COLUMNS = "80", NO_COLOR = "1" }
command = ["target/debug/skill-studio"]
snapshot = ".gate/snapshots/cli.snap"
extra_commands = [
  [
    "split",
  ],
  [
    "capabilities",
  ],
  [
    "harnesses",
  ],
  [
    "preview-repair",
  ],
  [
    "apply-repair",
  ],
  [
    "install-preferences",
  ],
  [
    "sweep-quarantine",
  ],
  [
    "schema",
  ],
  [
    "health",
  ],
  [
    "watch",
  ],
]

[[contracts]]
kind = "mcp"
env = { SKILL_STUDIO_MCP_DEV_TOOLS = "0" }
command = ["target/debug/skill-studio-mcp"]
snapshot = ".gate/snapshots/mcp.snap"

[[contracts]]
kind = "files"
glob = "crates/skill-studio-core/schema/*.json"
snapshot = ".gate/snapshots/schema.snap"
