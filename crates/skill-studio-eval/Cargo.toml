[package]
name = "skill-studio-eval"
version = "0.1.0"
edition = "2021"
description = "Repeatable skill evaluations through installed agent clients"
license = "MIT"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
shlex = "2"
schemars = { version = "1", features = ["chrono04"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

tokio = { version = "1", features = [
  "process",
  "io-util",
  "time",
  "sync",
  "rt-multi-thread",
  "macros",
  "signal",
] }
tempfile = "3"
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
nix = { version = "0.29", features = ["signal", "process"] }

serde_yaml = "0.9"
fs2 = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "5"

[dev-dependencies]
