[package]
name = "skill-studio-host"
version = "0.1.0"
edition = "2021"
description = "Real-world adapters (filesystem, clock, ids, leases, notices) for skill-studio-core"
license = "MIT"
publish = false

[lib]
name = "skill_studio_host"
path = "src/lib.rs"

# This crate's fs.rs holds one genuine FFI unsafe block (the macOS atomic
# rename swap `fsops::swap` needs). Cargo won't let a package override a
# single lint while also inheriting the rest via `workspace = true` (`cannot
# override workspace.lints in lints`), so this table restates the
# workspace's [workspace.lints.clippy]/[workspace.lints.rust] verbatim with
# only `unsafe_code` downgraded from `forbid` (never locally overridable) to
# `deny` (overridable call-site by call-site with a SAFETY comment). Keep
# this in sync with the root Cargo.toml by hand.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
default_trait_access = "allow"
items_after_statements = "allow"

[dependencies]
skill-studio-core = { path = "../skill-studio-core" }
# Lease takeover's liveness probe (see lease.rs). `sysinfo`, not `libc`'s
# `kill(pid, 0)`, because this crate forbids unsafe code.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
rusqlite = { version = "0.40", features = ["bundled"] }
percent-encoding = "2"
toml = "1.1.4"
url = "2"
# The desktop's crash-report client. Optional, behind the `telemetry`
# feature, so the CLI and MCP adapters - which never call
# `telemetry::init` - don't link it. `transport` = reqwest + native-tls,
# matching the desktop's existing reqwest. `panic`, `debug-images`,
# `release-health`, `logs`, and `metrics` stay off: this crate installs its
# own panic hook (so the panic payload text is never read), and the other
# features would ship a module list with binary paths, session/health
# pings, or telemetry PR1 doesn't add yet.
sentry = { version = "0.49", default-features = false, features = [
  "backtrace",
  "contexts",
  "transport",
], optional = true }
# Bounds the desktop crash-report client's HTTP timeout to SHUTDOWN_FLUSH
# (see ConsentTransportFactory::create_transport_with_options) - sentry's
# own reqwest client has no timeout, which could hang quit on a stalled
# network. `native-tls`, matching what sentry's own `transport` feature
# needs from reqwest; no `blocking`, since the alias `ReqwestClient` sentry
# builds against is the async `reqwest::Client`, not `reqwest::blocking::Client`.
reqwest = { version = "0.13", default-features = false, features = ["native-tls"], optional = true }

[features]
telemetry = ["dep:sentry", "dep:reqwest"]

[dev-dependencies]
tempfile = "3"
sentry = { version = "0.49", default-features = false, features = [
  "backtrace",
  "contexts",
  "transport",
  "test",
] }
