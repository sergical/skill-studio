name: Performance baseline

on:
  pull_request:
    # Selection only narrows PR feedback: every main push runs the full
    # workflow. These paths cannot change the Rust build or its tests; any
    # other path, including one nobody listed, runs it. Not docs/ or *.md:
    # the crates include_str! CHANGELOG.md and docs/flows.md.
    paths-ignore:
      - "packages/marketing/**"
      - "packages/ui/**"
      - "apps/server/**"
      - "apps/desktop/src/**"
      - "apps/desktop/e2e/**"
      - "tools/oxlint/**"
  # Main runs save the Rust cache that pull requests restore.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new commit on a pull request cancels that branch's older run. Main runs
  # and scheduled or manual runs each get their own group, so none is cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  baseline:
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-09-12
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: mkdir -p apps/desktop/dist
      - run: python3 tools/perf-baseline.py --output perf-artifacts/baseline.json
      - name: Publish measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-baseline
          path: perf-artifacts/
          if-no-files-found: warn
      - name: Show measurements
        if: always()
        run: |
          if [ -f perf-artifacts/baseline.md ]; then
            cat perf-artifacts/baseline.md >> "$GITHUB_STEP_SUMMARY"
          fi
