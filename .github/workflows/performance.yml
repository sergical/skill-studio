name: Performance baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-09-12
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: mkdir -p apps/desktop/dist
      - run: python3 tools/perf-baseline.py --output perf-artifacts/baseline.json
      - name: Publish measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-baseline
          path: perf-artifacts/
          if-no-files-found: warn
      - name: Show measurements
        if: always()
        run: |
          if [ -f perf-artifacts/baseline.md ]; then
            cat perf-artifacts/baseline.md >> "$GITHUB_STEP_SUMMARY"
          fi
