name: Weekly checks

# Ignored tests too slow for every PR. workflow_dispatch runs them between
# Mondays.
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-retention-at-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-11-09
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # 1,000 updates with a backup each: the cleanup keeps every backup
      # younger than 30 days, then trims to the set count without losing a
      # history row. Prints disk use before and after.
      - run: cargo test -p skill-studio-host --lib -- --ignored thousand_updates --nocapture
