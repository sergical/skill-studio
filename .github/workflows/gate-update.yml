name: Update auto-merge branches
on:
  push:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: gate-update
  cancel-in-progress: false
jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Update behind branches with auto-merge enabled
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GATE_UPDATE_TOKEN || github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&base=$BASE_BRANCH&per_page=100" --jq '.[] | select(.auto_merge != null) | [.number, .head.sha] | @tsv' > /tmp/candidates
          failed=0
          while IFS="$(printf '\t')" read -r number head; do
            [ -n "$number" ] || continue
            behind=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_BRANCH...$head" --jq .behind_by) || { failed=1; continue; }
            [ "$behind" -gt 0 ] || continue
            gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$number/update-branch" -f expected_head_sha="$head" || failed=1
          done < /tmp/candidates
          exit "$failed"
