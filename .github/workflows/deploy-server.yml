name: Deploy Server

# Manual only for now - no push trigger until the hosted URL has been
# rehearsed. The skills.sh key itself is never in this workflow: it's set
# once by hand with `wrangler secret put SKILLS_SH_API_KEY` (see
# apps/server/README.md).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w @skill-studio/server
      - name: Deploy to Cloudflare Workers
        working-directory: apps/server
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
