name: Mutants Weekly

on:
  # Weekly full mutation run (unit 5.2); workflow_dispatch lets a human
  # trigger the same run between Mondays without waiting for the cron. Kept
  # out of rust.yml so its triggers don't also run the push/pull_request
  # `test` job on the cron.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Full crate run. Sharded so each job stays inside the 6-hour GitHub
  # Actions cap; increase SHARD_COUNT and the matrix together if a crate
  # outgrows this. cargo-mutants shards are 0-indexed (`k/n` for k in
  # 0..n-1), so the matrix runs 0 through SHARD_COUNT - 1.
  mutants-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARD_COUNT: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-09-12
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-mutants
      - run: mkdir -p apps/desktop/dist
      - name: Run cargo mutants, full crate, this shard
        continue-on-error: true
        run: cargo mutants -p skill-studio-core -p skill-studio-host --all-features --no-shuffle --shard ${{ matrix.shard }}/${{ env.SHARD_COUNT }}
      - name: Mutation score per file, this shard
        if: always()
        run: |
          {
            echo "### cargo-mutants weekly, shard ${{ matrix.shard }}/${{ env.SHARD_COUNT }}"
            if [ -f mutants.out/outcomes.json ]; then
              echo "| module | caught | missed | unviable |"
              echo "| --- | --- | --- | --- |"
              while IFS= read -r f; do
                c=$(grep -c "^$f:" mutants.out/caught.txt 2>/dev/null || true)
                m=$(grep -c "^$f:" mutants.out/missed.txt 2>/dev/null || true)
                u=$(grep -c "^$f:" mutants.out/unviable.txt 2>/dev/null || true)
                echo "| $f | ${c:-0} | ${m:-0} | ${u:-0} |"
              done < <(cat mutants.out/caught.txt mutants.out/missed.txt mutants.out/unviable.txt 2>/dev/null | cut -d: -f1 | sort -u)
            else
              echo "cargo-mutants produced no report for this shard; see the run step's log for the missing wiring."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-weekly-shard-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore
