name: Web

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A new commit on a pull request cancels that branch's older run. Main runs
  # are never cancelled, so every main commit gets a full result.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @skill-studio/server run typecheck
      - run: pnpm run knip
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run doctor
      - run: pnpm run test
      - run: scripts/release/check-release-complete.test.sh
      - run: pnpm run versions:check
      - run: scripts/release/check-versions.test.sh
      - run: pnpm --filter skill-studio exec playwright install --with-deps chromium webkit
      - run: pnpm --filter skill-studio run test:browser
      - run: pnpm --filter skill-studio run test:e2e
      - run: pnpm --filter @skill-studio/marketing run build
