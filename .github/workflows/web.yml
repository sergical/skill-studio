name: Web

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @skill-studio/server run typecheck
      - run: pnpm run knip
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run doctor
      - run: pnpm run test
      - run: scripts/release/check-release-complete.test.sh
      - run: pnpm run versions:check
      - run: scripts/release/check-versions.test.sh
      - run: pnpm --filter @skill-studio/marketing run build

  # The browser tests take most of the Web time (e2e: 356 s at p50 in one job),
  # so they run beside `check` in 6 shards. Each shard is one job, and each job
  # uses a worker per core.
  e2e:
    name: e2e (${{ matrix.project }} ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Browsers and their system libraries come baked into this image; installing
    # them took 101-547 s per job (apt). Its version must match @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]
        shard: [1, 2, 3]
    env:
      PROJECT: ${{ matrix.project }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.project == 'chromium' && matrix.shard == 1
        run: pnpm --filter skill-studio run test:browser
      - run: pnpm --filter skill-studio exec playwright test --project="$PROJECT" --shard="$SHARD/3"
