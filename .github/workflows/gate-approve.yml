name: Approve one gate commit
on:
  pull_request_target:
    types: [labeled]
permissions:
  statuses: write
  issues: write
  pull-requests: write
jobs:
  approve:
    if: github.event.label.name == 'gate:approved'
    runs-on: ubuntu-latest
    steps:
      - name: Record approval and remove trigger
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f context=gate/approved -f state=success -f description="Human approval for this commit"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/gate%3Aapproved"
