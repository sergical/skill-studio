name: Approve one gate commit
run-name: ${{ github.event.label.name }} ${{ github.event.pull_request.head.sha }}
on:
  # Fork PRs need a write token to post the status. No step checks out or
  # runs PR code; the job uses only the event's head SHA and PR number.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [labeled]
permissions:
  statuses: write
  issues: write
  pull-requests: write
jobs:
  approve:
    if: github.event.label.name == 'gate:approved' && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Record approval and remove trigger
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL_TOKEN: ${{ secrets.GATE_UPDATE_TOKEN || github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f context=gate/approved -f state=success -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description="Approval for this commit"
          GH_TOKEN="$LABEL_TOKEN" gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/gate%3Aapproved"
