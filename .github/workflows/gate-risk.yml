name: Trusted merge risk
on:
  # The job needs a write token to post the status and label. It runs only
  # base-branch code and fetches the PR head as git objects for the diff.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
concurrency:
  group: gate-risk-${{ github.event.pull_request.number }}-${{ (github.event.action == 'edited' && !github.event.changes.base) && github.run_id || 'risk' }}
  cancel-in-progress: true
jobs:
  risk:
    # Only PRs to the protected default branch. A status belongs to the head
    # SHA, so a PR from the same head to another branch could overwrite it.
    if: github.event.pull_request.base.ref == github.event.repository.default_branch && (github.event.action != 'edited' || github.event.changes.base)
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify and label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          auth=$(printf "x-access-token:%s" "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch origin "refs/pull/$PR_NUMBER/head" --no-tags
          # Classify with the base branch code and policy, never the PR code.
          scripts/gate/gate risk --base "$BASE_SHA" --head "$HEAD_SHA" --author "$AUTHOR" --json > risk.json
          tier=$(jq -r .tier risk.json)
          reasons=$(jq -r '[.reasons[] | select(.tier == "stop") | .rule] | unique | join(", ")' risk.json)
          if [ "$tier" = stop ]; then
            # Pending, not failure: the PR cannot merge by itself, and no
            # failure email goes out. The owner merges it.
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" -f "labels[]=risk:owner" > /dev/null
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f context=gate/risk -f state=pending -f description="Owner merges: ${reasons:0:120}"
          else
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/risk%3Aowner" > /dev/null 2>&1 || true
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f context=gate/risk -f state=success -f description="Risk: $tier"
          fi
