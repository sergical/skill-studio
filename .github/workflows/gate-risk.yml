name: Trusted merge risk
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
permissions:
  contents: read
concurrency:
  group: gate-risk-${{ github.event.pull_request.number }}-${{ (github.event.action == 'edited' && !github.event.changes.base) && github.run_id || 'risk' }}
  cancel-in-progress: true
jobs:
  risk:
    if: github.event.action != 'edited' || github.event.changes.base
    permissions:
      contents: read
      statuses: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test and classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          auth=$(printf "x-access-token:%s" "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch origin "refs/pull/$PR_NUMBER/head" --no-tags
          APPROVED=false
          if [ -f scripts/gate/approval.py ]; then
            APPROVED=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/statuses?per_page=100" | jq 'add' | python3 scripts/gate/approval.py)
          fi
          # Classify with the base branch code and policy, never the PR code.
          scripts/gate/gate risk --base "$BASE_SHA" --head "$HEAD_SHA" --author "$AUTHOR" --json > risk.json
          tier=$(jq -r .tier risk.json)
          state=success
          if [ "$tier" = stop ] && [ "$APPROVED" != true ]; then state=failure; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f context=gate/risk -f state="$state" -f description="Risk: $tier; approved: $APPROVED"
          test "$state" = success
